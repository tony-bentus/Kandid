services:
  mysql:
    image: mysql:8.4
    container_name: kandid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kandid
      MYSQL_USER: kandid
      MYSQL_PASSWORD: kandid
    ports:
      - '3306:3306'
    volumes:
      - kandid_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kandid_mysql_data:
