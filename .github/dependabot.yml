version: 2

updates:
  - package-ecosystem: npm
    directory: /kandid_api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      nest:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /kandid_api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
