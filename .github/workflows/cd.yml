name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/kandid-api

jobs:
  image:
    name: build-and-push-image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: kandid_api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: migrate
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: demo
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_SSL: 'true'
    defaults:
      run:
        working-directory: kandid_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kandid_api/package-lock.json
      # Instala devDependencies (tsx) porque o CLI de migration roda via tsx.
      - run: npm ci
      - run: npm run migration:run
        env:
          NODE_ENV: production

  deploy:
    name: deploy-demo
    runs-on: ubuntu-latest
    needs: [image, migrate]
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: demo
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for healthy demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL variable is not configured" >&2
            exit 1
          fi
          for attempt in $(seq 1 20); do
            body=$(curl --silent --fail "$DEMO_URL/v1/health" || true)
            if [ -n "$body" ] && echo "$body" | jq -e '.status == "ok" and .services.database == "up"' > /dev/null; then
              echo "demo healthy on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt not healthy: ${body:-no response}"
            sleep 15
          done
          echo "demo did not become healthy in time" >&2
          exit 1
