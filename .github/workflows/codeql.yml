name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: analyze-javascript-typescript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kandid_api/package-lock.json

      - run: npm ci
        working-directory: kandid_api

      - run: npm run build
        working-directory: kandid_api

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
